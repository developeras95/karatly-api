# Builds the project and runs every test on each push to main and on every pull request.
# Testcontainers starts PostgreSQL in Docker, which GitHub's Ubuntu runners provide.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # adds a "Run workflow" button on the Actions tab

permissions:
  contents: read            # the job only reads the code

concurrency:                # a newer push to the same branch cancels the older run
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven        # reuses downloaded dependencies between runs

      - name: Build, run tests and measure coverage
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Upload test results
        if: always()          # most useful when tests fail
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore
